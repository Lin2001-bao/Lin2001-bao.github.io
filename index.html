<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>会玩修仙奇遇录 · 奇遇答案与奖励速查</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --jade:#5fd6b0; --jade-soft:#a8f0d8; --gold:#e7c98a; --gold-soft:#f3e0b6;
  --text:#f4fbf8; --muted:rgba(226,247,240,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--text);line-height:1.75;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#050f10;
  background-image:url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/RDvsbU8zoovbT0xJpyAcTUeJnnb");
  background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(3,10,12,.34) 0%,rgba(4,14,15,.46) 45%,rgba(2,8,9,.66) 100%);
}
body::after{
  content:"";position:fixed;left:50%;top:-140px;transform:translateX(-50%);
  width:920px;height:440px;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(120,255,214,.16),transparent 70%);filter:blur(12px);
}
.wrap{max-width:940px;margin:0 auto;padding:0 16px 64px;position:relative;z-index:1}

/* 玻璃通用 */
.glass{
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(18px) saturate(145%);backdrop-filter:blur(18px) saturate(145%);
  border:1px solid rgba(255,255,255,.26);border-radius:20px;
  box-shadow:0 12px 34px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.34), inset 0 -1px 0 rgba(255,255,255,.05);
}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand .mk{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif SC",serif;font-size:16px;color:var(--gold-soft);
  background:rgba(255,255,255,.1);border:1px solid rgba(231,201,138,.5);
  box-shadow:0 0 18px rgba(231,201,138,.25), inset 0 1px 0 rgba(255,255,255,.4);
}
.brand .logo{width:44px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 0 18px rgba(231,201,138,.42),inset 0 1px 0 rgba(255,255,255,.35)}
.brand em{font-style:normal;font-family:"Noto Serif SC",serif;font-size:.98rem;letter-spacing:.18em;color:#f2e6c6}
.back{
  text-decoration:none;font-size:.8rem;color:#eafff8;padding:9px 18px;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32);transition:.25s;white-space:nowrap;
}
.back:hover{background:rgba(255,255,255,.18);border-color:rgba(168,240,216,.6)}

/* 金线 */
.hairline{height:1px;margin:20px 0;background:linear-gradient(90deg,transparent,rgba(231,201,138,.45) 20%,rgba(231,201,138,.45) 80%,transparent)}

/* 标题区 */
.hero{text-align:center;padding:30px 0 6px}
.eyebrow{font-size:.66rem;letter-spacing:.42em;color:rgba(231,201,138,.78);margin-bottom:14px}
.title{
  font-family:"Noto Serif SC",serif;font-weight:700;margin:0 0 10px;
  font-size:clamp(1.55rem,4.6vw,2.2rem);letter-spacing:.1em;line-height:1.4;
  background:linear-gradient(180deg,#ffffff 0%,#d9f7ea 52%,#9fe0c6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,.45));
}
.desc{color:rgba(232,250,244,.85);font-size:.9rem;margin:6px auto 0;max-width:580px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ornament{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 0}
.ornament i{display:block;height:1px;width:56px;background:linear-gradient(90deg,transparent,rgba(231,201,138,.6))}
.ornament i:last-child{background:linear-gradient(90deg,rgba(231,201,138,.6),transparent)}
.ornament b{width:6px;height:6px;border-radius:50%;background:rgba(231,201,138,.85);box-shadow:0 0 10px rgba(231,201,138,.7)}

/* 数据块 */
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:26px 0 8px}
.stat{flex:1 1 110px;max-width:180px;text-align:center;padding:16px 10px;border-radius:18px}
.stat .n{display:block;font-family:"Noto Serif SC",serif;font-size:1.36rem;color:var(--jade-soft);text-shadow:0 0 20px rgba(95,214,176,.5)}
.stat .l{font-size:.7rem;color:var(--muted);letter-spacing:.16em}
.stat.js-goto{cursor:pointer;transition:.25s}
.stat.js-goto:hover{transform:translateY(-2px);border-color:rgba(231,201,138,.5)}

/* 导航卡 */
.navs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 4px}
.navs .nav:last-child{grid-column:1 / -1}
.navs .nav:last-child .ic{background:rgba(231,201,138,.16);border-color:rgba(231,201,138,.5)}
.navs .nav:last-child .tx b{color:#f7e8c8}
.nav{
  display:flex;align-items:center;gap:13px;padding:16px 16px;border-radius:18px;text-decoration:none;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(16px) saturate(145%);backdrop-filter:blur(16px) saturate(145%);
  border:1px solid rgba(255,255,255,.24);
  box-shadow:0 10px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .22s, border-color .25s, box-shadow .28s;position:relative;overflow:hidden;
}
.nav:hover{transform:translateY(-2px);border-color:rgba(231,201,138,.6);box-shadow:0 16px 38px rgba(0,0,0,.38), 0 0 24px rgba(231,201,138,.16), inset 0 1px 0 rgba(255,255,255,.4)}
.nav .ic{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(95,214,176,.16);border:1px solid rgba(168,240,216,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.nav .ic svg{width:19px;height:19px;stroke:#b9ffe6;fill:none;stroke-width:1.7}
.nav .tx{flex:1;min-width:0}
.nav .tx b{display:block;font-family:"Noto Serif SC",serif;font-size:.98rem;letter-spacing:.04em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.nav .tx span{display:block;font-size:.7rem;color:rgba(232,250,244,.62);margin-top:2px}
.nav .ar{flex:0 0 auto;color:rgba(231,201,138,.9);font-size:1rem}

/* 搜索 */
.search-box{position:relative;margin:22px auto 12px;max-width:620px}
.search-box input{
  width:100%;padding:16px 50px;border-radius:999px;color:#fff;font-size:.78rem;outline:none;
  background:rgba(255,255,255,.11);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 8px 26px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.4);
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.search-box input::placeholder{color:rgba(230,250,244,.52)}
.search-box input:focus{background:rgba(255,255,255,.16);border-color:rgba(231,201,138,.62);box-shadow:0 0 0 3px rgba(231,201,138,.18),0 8px 26px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.5)}
.search-box .ico{position:absolute;left:19px;top:50%;transform:translateY(-50%);width:17px;height:17px;opacity:.8;pointer-events:none}
.search-box .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:33px;height:33px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#e9fbf5;font-size:15px;cursor:pointer;display:none}
.search-drop{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:60;display:none;flex-direction:column;gap:10px;max-height:min(62vh,460px);overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.search-drop.show{display:flex}
.search-drop .card{
  cursor:pointer;flex:0 0 auto;
  background:linear-gradient(180deg,rgba(20,44,42,.34),rgba(8,22,23,.44));
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(255,255,255,.18);
}
.search-drop .card:hover,.search-drop .card.open{
  border-color:rgba(231,201,138,.62);
  background:linear-gradient(180deg,rgba(231,201,138,.15),rgba(16,38,37,.34));
  box-shadow:0 10px 28px rgba(0,0,0,.32),0 0 18px rgba(231,201,138,.12),inset 0 1px 0 rgba(255,255,255,.35);
}
.search-drop .head{padding:12px 13px 10px}
.search-drop .qtxt{font-size:.86rem;line-height:1.5}
.search-drop .qtxt .no{font-size:.78rem}
.search-drop .badges{margin-top:8px;gap:5px}
.search-drop .badge{font-size:.68rem;padding:2px 8px}
.search-drop .ans-pair{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;padding:2px 9px;border-radius:8px;color:#d8fff1;background:rgba(95,214,176,.18);border:1px solid rgba(168,240,216,.45)}
.search-drop .ans-pair b{color:var(--gold-soft);font-weight:700}
.search-drop .ans-pair em{font-style:normal;opacity:.5}
.search-drop .ans-pair i{font-style:normal}
.search-drop .ans-pair.bad{color:#ffd6cf;background:rgba(255,120,105,.16);border-color:rgba(255,157,146,.45)}
.search-drop .more{font-size:.7rem}
.search-drop .more svg{width:13px;height:13px}
.search-drop .body{padding:0 13px 12px}
.search-drop::-webkit-scrollbar{width:6px}
.search-drop::-webkit-scrollbar-track{background:transparent}
.search-drop::-webkit-scrollbar-thumb{background:rgba(231,201,138,.32);border-radius:6px}
.search-drop::-webkit-scrollbar-thumb:hover{background:rgba(231,201,138,.55)}
.search-drop .opts{gap:7px}
.search-drop .opt{font-size:.82rem;padding:9px 11px;border-radius:11px}
.search-drop .opt .lab{width:19px;height:19px;font-size:.68rem}
.di-empty{padding:12px 11px;font-size:.78rem;color:rgba(232,250,244,.7);text-align:center}

.rtip{text-align:center;font-size:.8rem;color:rgba(232,250,244,.86);min-height:1.4em;margin:4px 0 16px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rtip b{color:var(--gold-soft);font-weight:600}

/* 分类 */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.chip{
  padding:8px 15px;border-radius:999px;font-size:.78rem;cursor:pointer;user-select:none;
  color:rgba(235,252,246,.84);background:rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.22);transition:.22s;
}
.chip:hover{border-color:rgba(231,201,138,.55);color:#fff}
.chip.on{
  background:linear-gradient(180deg,rgba(231,201,138,.32),rgba(95,214,176,.16));
  border-color:rgba(231,201,138,.8);color:#fff;
  box-shadow:0 0 20px rgba(231,201,138,.3), inset 0 1px 0 rgba(255,255,255,.5);
}
.chip i{font-style:normal;opacity:.7;font-size:.72rem;margin-left:4px}

/* 卡片 */
.list{display:flex;flex-direction:column;gap:12px}
.card{
  border-radius:18px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,rgba(12,30,30,.4),rgba(6,18,19,.52));
  -webkit-backdrop-filter:blur(18px) saturate(145%);backdrop-filter:blur(18px) saturate(145%);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);
  transition:border-color .25s, box-shadow .28s;
}
.card:hover{border-color:rgba(231,201,138,.45);box-shadow:0 14px 36px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.4)}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(231,201,138,.5),transparent)}
.head{padding:16px 16px 13px;cursor:pointer}
.qtxt{font-family:"Noto Serif SC",serif;font-size:1rem;line-height:1.65;color:#fff;display:flex;gap:9px;align-items:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.qtxt .no{color:var(--gold);flex:0 0 auto;font-size:.86rem;opacity:.95}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px}
.badge{font-size:.72rem;padding:3px 10px;border-radius:8px;letter-spacing:.04em;color:#d8fff1;background:rgba(95,214,176,.18);border:1px solid rgba(168,240,216,.45)}
.badge.bad{color:#ffd6cf;background:rgba(255,120,105,.16);border-color:rgba(255,157,146,.45)}
.badge.none{color:rgba(235,250,246,.72);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24)}
.more{margin-left:auto;font-size:.74rem;color:rgba(235,252,246,.82);display:flex;align-items:center;gap:5px}
.more svg{width:14px;height:14px;transition:transform .3s}
.card.open .more svg{transform:rotate(180deg)}
.body{display:none;padding:0 16px 16px}
.card.open .body{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;font-size:.9rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
.opt.right{background:linear-gradient(180deg,rgba(111,240,182,.22),rgba(95,214,176,.1));border-color:rgba(111,240,182,.6);box-shadow:0 0 18px rgba(95,214,176,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.opt .lab{flex:0 0 auto;width:21px;height:21px;border-radius:50%;font-size:.72rem;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);color:#eafaf5;border:1px solid rgba(255,255,255,.26)}
.opt.right .lab{background:rgba(111,240,182,.9);color:#03150f;font-weight:700;border-color:transparent}
.opt .txt{flex:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.opt .rw{font-size:.72rem;color:var(--jade-soft)}
.opt .rw.bad{color:#ffb3aa}
.tip{margin-top:10px;font-size:.76rem;color:rgba(232,250,244,.86);text-shadow:0 1px 3px rgba(0,0,0,.45)}

/* 通用按钮 */
.more-wrap{text-align:center;margin-top:24px}
.btn{
  padding:12px 32px;border-radius:999px;cursor:pointer;font-size:.86rem;letter-spacing:.08em;
  font-family:"Noto Serif SC",serif;color:#eafff8;background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(231,201,138,.5);
  box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35);transition:.25s;
}
.btn:hover{background:rgba(255,255,255,.17);border-color:rgba(231,201,138,.85)}

.empty{text-align:center;padding:50px 0;color:rgba(225,247,240,.74);border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15)}
.empty span{display:block;font-size:1.6rem;margin-bottom:8px;opacity:.55}

/* 内容卡片（子页面） */
.section{padding:20px 18px;border-radius:20px;margin-bottom:12px}
.section h2{
  font-family:"Noto Serif SC",serif;font-size:1.04rem;margin:0 0 12px;letter-spacing:.06em;color:#fff;
  display:flex;align-items:center;gap:9px;text-shadow:0 1px 3px rgba(0,0,0,.42);
}
.section h2::before{content:"";width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--jade));box-shadow:0 0 10px rgba(231,201,138,.6)}
.section h3{font-family:"Noto Serif SC",serif;font-size:.95rem;margin:18px 0 6px;color:var(--gold-soft)}
.section p{margin:0 0 10px;font-size:.9rem;color:rgba(238,252,247,.9);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.section p.note{font-size:.82rem;color:rgba(232,250,244,.72)}

/* 表格 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.86rem}
thead th{
  position:sticky;top:0;background:rgba(14,36,34,.86);color:#eafff8;font-weight:600;
  padding:12px 12px;text-align:left;white-space:nowrap;font-family:"Noto Serif SC",serif;letter-spacing:.06em;
  border-bottom:1px solid rgba(231,201,138,.35);
}
tbody td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.08);color:rgba(240,253,249,.92);white-space:nowrap}
tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
tbody td:first-child{color:#fff;font-family:"Noto Serif SC",serif}
td.hi{color:var(--gold-soft)}
tbody tr:hover{background:rgba(95,214,176,.09)}

/* 计算器 */
.calc{padding:22px 18px;border-radius:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;color:rgba(232,250,244,.8);margin-bottom:8px;letter-spacing:.08em}
.field input{
  width:100%;padding:14px 16px;border-radius:14px;color:#fff;font-size:.95rem;outline:none;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.26);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:.2s;
}
.field input:focus{border-color:rgba(231,201,138,.65);box-shadow:0 0 0 3px rgba(231,201,138,.16),inset 0 1px 0 rgba(255,255,255,.45)}
.result{margin-top:18px;padding:18px;border-radius:16px;background:rgba(95,214,176,.12);border:1px solid rgba(168,240,216,.45);text-align:center}
.result .big{font-family:"Noto Serif SC",serif;font-size:1.9rem;color:#eafff8;text-shadow:0 0 22px rgba(95,214,176,.6)}
.result .small{font-size:.78rem;color:rgba(232,250,244,.8);margin-top:6px}
.chain{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chain b{
  font-family:"Noto Serif SC",serif;font-weight:500;font-size:.84rem;color:#eafff8;padding:6px 12px;border-radius:10px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
}
.chain .ar{color:rgba(231,201,138,.8);align-self:center}

footer{
  margin-top:40px;padding:18px 20px;border-radius:16px;text-align:center;font-size:.74rem;
  color:rgba(220,245,237,.62);line-height:1.9;background:rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);
}
@media (max-width:520px){
  .navs{grid-template-columns:1fr}
  .stats{gap:8px}
  .stat{flex:1 1 90px;padding:13px 6px}
}
</style>
<style id="contrast-fix">
.glass{background:linear-gradient(180deg,rgba(10,28,27,.44),rgba(5,16,17,.58))!important}
.nav{background:linear-gradient(180deg,rgba(10,28,27,.46),rgba(5,16,17,.62))!important;border-color:rgba(255,255,255,.28)!important}
.stat{background:linear-gradient(180deg,rgba(10,28,27,.46),rgba(5,16,17,.62))!important}
.search-box input{background:rgba(6,20,20,.48)!important}
.chip{background:rgba(6,20,20,.42)!important}
.section.glass h2,.section.glass p,.section.glass h3{text-shadow:0 1px 4px rgba(0,0,0,.6)!important}
tbody tr:nth-child(even){background:rgba(255,255,255,.045)!important}
.tbl-wrap{background:rgba(4,14,15,.35)!important}
</style>

</head>
<body>

":"","correct":false},{"label":"B","text":"放弃挽救","reward":"仙工镐","correct":true}],"ans":"B"},{"id":354,"q":"143、你在修炼中遇到心魔侵扰，影响修行","opts":[{"label":"A","text":"以道心镇压","reward":"","correct":false},{"label":"B","text":"求师尊帮助","reward":"仙工镐","correct":true}],"ans":"B"},{"id":365,"q":"144、你发现一处隐藏的修炼秘境，但入口被强大禁制封印","opts":[{"label":"A","text":"个人破解","reward":"仙工镐","correct":true},{"label":"B","text":"寻求帮助","reward":"","correct":false}],"ans":"A"},{"id":364,"q":"145、你在秘境探险时，发现一株即将成熟的千年灵草","opts":[{"label":"A","text":"守护灵草","reward":"仙工镐","correct":true},{"label":"B","text":"立即采摘","reward":"","correct":false}],"ans":"A"},{"id":357,"q":"146、你在一处幽深的古洞中发现了一池神秘的灵泉","opts":[{"label":"A","text":"跃入灵泉","reward":"仙工镐","correct":true},{"label":"B","text":"摧毁灵泉","reward":"","correct":false}],"ans":"A"},{"id":358,"q":"147、你在一处古老的祭坛上发现了能够召唤灵兽的法阵","opts":[{"label":"A","text":"用灵力召唤","reward":"","correct":false},{"label":"B","text":"用意念召唤","reward":"仙工镐","correct":true}],"ans":"B"},{"id":363,"q":"148、你误入了一个时间流速不同的秘境，外界一日，秘境百年","opts":[{"label":"A","text":"立刻修炼","reward":"","correct":false},{"label":"B","text":"寻找出口","reward":"仙工镐","correct":true}],"ans":"B"},{"id":361,"q":"149、你正在闭关修炼，突闻宗门遭遇强敌入侵","opts":[{"label":"A","text":"出关迎战","reward":"仙工镐","correct":true},{"label":"B","text":"继续闭关","reward":"","correct":false}],"ans":"A"},{"id":360,"q":"150、你遇到一位重伤的修士，它拥有强大的修为","opts":[{"label":"A","text":"出手相救","reward":"仙工镐","correct":true},{"label":"B","text":"视而不见","reward":"","correct":false}],"ans":"A"},{"id":362,"q":"151、你所在的宗门即将举行大比，选拔年轻才俊","opts":[{"label":"A","text":"积极备战","reward":"仙工镐","correct":true},{"label":"B","text":"低调参与","reward":"","correct":false}],"ans":"A"},{"id":359,"q":"152、你偶然得到了一枚神秘的古玉，内含强大灵力","opts":[{"label":"A","text":"占为己有","reward":"仙工镐","correct":true},{"label":"B","text":"交予宗门","reward":"","correct":false}],"ans":"A"},{"id":356,"q":"153、你发现了一处废弃的修仙宗门遗址，内藏无数法宝","opts":[{"label":"A","text":"搜罗宝物","reward":"","correct":false},{"label":"B","text":"修复宗门","reward":"仙工镐","correct":true}],"ans":"B"},{"id":355,"q":"154、你误入了一个由妖兽统治的秘境，人类修士在这里会被奴役","opts":[{"label":"A","text":"寻找出口","reward":"仙工镐","correct":true},{"label":"B","text":"奋起反击","reward":"","correct":false}],"ans":"A"},{"id":366,"q":"155、在一处废墟中发现古老的福禄","opts":[{"label":"A","text":"研究福禄","reward":"修为","correct":true},{"label":"B","text":"上交福禄","reward":"","correct":false}],"ans":"A"},{"id":417,"q":"156、妖界突然发动入侵，你所在的地区面临危机（福袋赠送）","opts":[{"label":"A","text":"挺身而出","reward":"","correct":false},{"label":"B","text":"逃离危险","reward":"修为","correct":true}],"ans":"B"},{"id":418,"q":"157、你在一次历练中遇到了一位神秘的老者，他声称能预测未来（福袋赠送）","opts":[{"label":"A","text":"请他预测","reward":"修为","correct":true},{"label":"B","text":"拒绝预测","reward":"","correct":false}],"ans":"A"},{"id":419,"q":"158、你在山间漫步时，发现了一株传说中的仙草，它散发着诱人的灵气（福袋赠送）","opts":[{"label":"A","text":"采摘仙草","reward":"修为","correct":true},{"label":"B","text":"留下仙草","reward":"","correct":false}],"ans":"A"},{"id":420,"q":"159、你在山间小径上偶遇一位美丽的仙子，她似乎正在寻找失落的法器（福袋赠送）","opts":[{"label":"A","text":"帮助仙子","reward":"修为","correct":true},{"label":"B","text":"婉言谢绝","reward":"","correct":false}],"ans":"A"}];
const state = { kw:'' };
function isBad(r){ return r==='扣修为' || r==='空气'; }
function rewardsOf(item){
  const set=[]; item.opts.forEach(o=>{ if(o.reward && !set.includes(o.reward)) set.push(o.reward); });
  return set;
}
function stripNo(q){ return q.replace(/^\d+、/,''); }
const input = document.getElementById('q');
const clr = document.getElementById('clr');
const drop = document.getElementById('drop');
function matchKw(it, kw){
  if(it.q.toLowerCase().includes(kw)) return true;
  return it.opts.some(o=>o.text.toLowerCase().includes(kw));
}
function optsHtml(it){
  return it.opts.map(o=>{
    const cls = o.correct ? 'opt right' : 'opt';
    const rw = o.reward ? ('<span class="rw'+(isBad(o.reward)?' bad':'')+'">'+o.reward+'</span>') : '';
    return '<div class="'+cls+'"><span class="lab">'+o.label+'</span><span class="txt">'+o.text+'</span>'+rw+'</div>';
  }).join('');
}
function renderDrop(){
  const kw = state.kw.trim().toLowerCase();
  if(!kw){ drop.classList.remove('show'); drop.innerHTML=''; return; }
  const rows = DATA.filter(it=>matchKw(it, kw));
  if(!rows.length){
    drop.innerHTML = '<div class="di-empty">无匹配题目，换个关键词试试</div>';
    drop.classList.add('show'); return;
  }
  drop.innerHTML = rows.slice(0,8).map(it=>{
    const no = it.q.split('、')[0]+'、';
    const ansPairs = it.opts.filter(o=>o.correct).map(o=>{
      const bad = isBad(o.reward);
      const rw = o.reward ? '<i'+(bad?' class="bad"':'')+'>'+o.reward+'</i>' : '';
      return '<span class="ans-pair'+(bad?' bad':'')+'"><b>'+o.label+'</b>'+(rw?'<em>|</em>':'')+rw+'</span>';
    }).join('') || '<span class="badge none">无奖励</span>';
    return '<div class="card" data-id="'+it.id+'">'
      + '<div class="head"><div class="qtxt"><span class="no">'+no+'</span><span>'+stripNo(it.q)+'</span></div>'
      + '<div class="badges">'+ansPairs+'<span class="more">查看完整答案<svg viewBox="0 0 24 24" fill="none" stroke="#cfeee6" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span></div></div>'
      + '<div class="body"><div class="opts">'+optsHtml(it)+'</div></div></div>';
  }).join('');
  drop.classList.add('show');
}
function applySearch(v){
  v = v || ''; if(v === state.kw) return;
  state.kw = v;
  clr.style.display = v ? 'block' : 'none';
  renderDrop();
}
let idleTimer=null;
function resetIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>input.blur(),1000); }
['input','change','keyup','keydown','compositionend','search','paste','cut'].forEach(ev=>{
  input.addEventListener(ev, ()=>{ resetIdle(); applySearch(input.value); });
});
input.addEventListener('keydown', e=>{ if(e.key === 'Enter') applySearch(input.value); });
setInterval(()=>applySearch(input.value), 300);
clr.addEventListener('click', ()=>{ clearTimeout(idleTimer); input.value=''; state.kw=''; clr.style.display='none'; renderDrop(); input.focus(); });
function toggleCard(card){
  if(!card) return;
  clearTimeout(idleTimer);
  input.blur();
  card.classList.toggle('open');
  if(card.classList.contains('open')){
    requestAnimationFrame(()=>{
      const dr=drop.getBoundingClientRect(), r=card.getBoundingClientRect();
      if(r.bottom>dr.bottom) drop.scrollTop += (r.bottom-dr.bottom)+8;
      else if(r.top<dr.top) drop.scrollTop -= (dr.top-r.top)+8;
    });
  }
}
drop.addEventListener('click', e=>{
  const head = e.target.closest('.head'); if(!head) return;
  e.preventDefault(); toggleCard(head.parentElement);
});
let touchY=null, touchX=null;
drop.addEventListener('touchstart', e=>{ const t=e.touches[0]; touchY=t.clientY; touchX=t.clientX; }, {passive:true});
drop.addEventListener('touchend', e=>{
  const head = e.target.closest('.head'); if(!head) return;
  const t=e.changedTouches[0];
  if(Math.abs(t.clientY-touchY)>10 || Math.abs(t.clientX-touchX)>10) return;
  e.preventDefault(); toggleCard(head.parentElement);
}, {passive:false});
document.addEventListener('pointerdown', e=>{ const t=e.target&&e.target.closest?e.target.closest('.search-box'):null; if(!t) drop.classList.remove('show'); });
document.addEventListener('mousedown', e=>{ const t=e.target&&e.target.closest?e.target.closest('.search-box'):null; if(!t) drop.classList.remove('show'); });
input.addEventListener('focus', ()=>{ if(state.kw.trim()) renderDrop(); });
</script>
